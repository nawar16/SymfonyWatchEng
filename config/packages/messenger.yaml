framework:
    messenger:
        failure_transport: failed
        transports:
            async: 
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0 #1 failed ping = exactly 1 failure signal
            async_notifications:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: notifications
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: failed_messages

        routing:
            'App\Monitoring\Application\Command\CheckMonitorCommand': async
            'App\Monitoring\Domain\Event\IncidentCreatedEvent': async_notifications
            'App\Monitoring\Domain\Event\IncidentResolvedEvent': async_notifications
            'App\Monitoring\Application\Command\CheckEscalationCommand': async_notifications
