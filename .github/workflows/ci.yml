name: CI

on:
  push:
  pull_request:

jobs:
  docker-compose-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment overrides
        shell: bash
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=67d1217409d5" >> .env
          echo "DATABASE_URL=postgresql://dummy:dummy@postgres:5432/postgres" >> .env

          cat <<'EOF' > .env.local
          APP_ENV=dev
          DEFAULT_URI=http://nginx     
          DATABASE_URL="postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8"
          SESSION_URL="postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8"
          REDIS_URL="redis://redis:6379"
          MAILER_DSN="smtp://mailpit:1025"
          EOF

      - name: Start Docker services
        run: docker compose up -d --build

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U 'postgres.${{ secrets.DB_USER }}' -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Verify raw PostgreSQL connection
        run: docker compose exec -T postgres psql -U 'postgres.${{ secrets.DB_USER }}' -d postgres -c 'SELECT 1;'

      - name: Mark repository as safe for Git inside container
        run: docker compose exec -T php git config --global --add safe.directory /var/www/html

      - name: Install Composer dependencies
        run: docker compose exec -T php composer install --no-interaction --prefer-dist  --no-scripts

      - name: Install Doctrine ORM pack
        run: docker compose exec -T php composer require symfony/orm-pack --no-interaction --prefer-dist --no-scripts

      - name: Install Lexik JWT bundle
        run: docker compose exec -T php composer require lexik/jwt-authentication-bundle --no-interaction --prefer-dist --no-scripts

      - name: Install Symfony test tooling
        run: docker compose exec -T php composer require --dev symfony/test-pack --no-interaction --prefer-dist --no-scripts

      - name: Verify Doctrine database connectivity
        run: docker compose exec -T php php bin/console doctrine:database:create --if-not-exists

      - name: Create test database
        run: docker compose exec -T -e APP_ENV=test -e TEST_DATABASE_URL='postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8' php php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Generate JWT Keys
        run: |
          mkdir -p config/jwt
          echo "${{ secrets.JWT_PASSPHRASE }}" > config/jwt/passphrase.txt
          php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction

      - name: Run functional tests
        env:
          APP_ENV: test
        run: docker compose exec -T -e APP_ENV=test -e TEST_DATABASE_URL='postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8' php php vendor/bin/phpunit

      - name: Shut down services
        if: always()
        run: docker compose down -v
