name: CI

on:
  push:
  pull_request:

jobs:
  docker-compose-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment files
        shell: bash
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=67d1217409d5" >> .env
          echo "DATABASE_URL=postgresql://dummy:dummy@postgres:5432/postgres" >> .env

          mkdir -p config/jwt

          cat <<'EOF' > .env.local
          APP_ENV=dev
          DATABASE_URL="postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8"
          EOF

          cat <<'EOF' > .env.test.local
          APP_ENV=test
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          DATABASE_URL="postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8"
          TEST_DATABASE_URL="postgresql://postgres.${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/postgres?serverVersion=16.0.0&charset=utf8"
    
          EOF

      - name: Start Docker services
        run: docker compose up -d --build

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U 'postgres.${{ secrets.DB_USER }}' -d postgres; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install Dependencies
        run: |
          docker compose exec -T php git config --global --add safe.directory /var/www/html
          docker compose exec -T php composer install --no-interaction --prefer-dist --no-scripts
          docker compose exec -T php composer require symfony/orm-pack lexik/jwt-authentication-bundle --no-interaction --no-scripts
          docker compose exec -T php composer require --dev symfony/test-pack --no-interaction --no-scripts

      - name: Generate JWT Keys
        run: |
          docker compose exec -T \
            -e JWT_PASSPHRASE="${{ secrets.JWT_PASSPHRASE }}" \
            -e JWT_SECRET_KEY="config/jwt/private.pem" \
            -e JWT_PUBLIC_KEY="config/jwt/public.pem" \
            php php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction
          docker compose exec -T php chown -R www-data:www-data config/jwt

      - name: Setup Database & Run Tests
        run: |
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:database:create --if-not-exists
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:schema:create
          docker compose exec -T -e APP_ENV=test php php vendor/bin/phpunit

      - name: Shut down services
        if: always()
        run: docker compose down -v
